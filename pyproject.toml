[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "desi-msi-clustering"
version = "1.0.0"
description = "Unsupervised spatial segmentation of DESI-MSI data using PCA and K-means clustering."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
]


[project.optional-dependencies]
dev = [
    "mypy",
    "pandas-stubs",
    "pytest",
    "ruff",
]

[project.scripts]
desi-msi-clustering = "msi_clustering.pipeline:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/msi_clustering"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
