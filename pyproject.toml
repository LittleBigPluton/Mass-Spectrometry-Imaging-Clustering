[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "desi-msi-clustering"
version = "0.1.0"
description = "Unsupervised spatial segmentation of DESI-MSI data using PCA and K-means clustering."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
]


[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]


[project.scripts]
desi-msi-clustering = "msi_clustering.pipeline:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
